<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Giro Vendas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="setupScreen" class="full-screen hidden"></div>

<div id="appShell" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/logo.png" alt="Giro Vendas">
      <div><strong>Giro Vendas</strong><span>Desktop</span></div>
    </div>
    <div class="company" id="companyName"></div>

    <nav id="nav">
      <button data-page="home" class="active">⌂ <span>Início</span></button>
      <button data-page="sell">🛒 <span>Nova venda</span></button>
      <button data-page="products">▦ <span>Produtos</span></button>
      <button data-page="clients">♙ <span>Clientes</span></button>
      <button data-page="orders">▤ <span>Pedidos</span></button>
      <button data-page="financial">◈ <span>Financeiro</span></button>
      <button data-page="expenses">− <span>Despesas</span></button>
      <button data-page="reports">◫ <span>Relatórios</span></button>
      <button data-page="visits">⌖ <span>Rotas e visitas</span></button>
      <button data-page="assistant">✦ <span>Assistente</span></button>
    </nav>

    <div class="sidebar-bottom">
      <button data-page="settings">⚙ <span>Configurações</span></button>
      <button id="backupBtn">⇩ <span>Backup</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Início</h1>
        <p id="pageSubtitle">Visão geral do seu negócio</p>
      </div>
      <div class="top-actions">
        <button class="secondary" id="quickSearchBtn">Ctrl + K</button>
        <button class="primary" data-page="sell">+ Nova venda</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-header"><h2 id="modalTitle"></h2><button id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
