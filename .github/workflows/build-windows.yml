name: Build Giro Vendas para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Recompilar módulos nativos para Electron
        run: npm run rebuild-native

      - name: Gerar instalador Windows
        run: npm run dist

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Giro-Vendas-Windows
          path: release/Giro-Vendas-Desktop-Setup.exe
          if-no-files-found: error
